D=F+R; P=αD; R=(1−α)D; tính circulating load và fineness.                                     | Separator speed fault → α↓ hoặc cut size thay đổi.    |\n| FN-401A  | M03 M04 M10                 | Qgas, Δp, Pfan theo fan/system curve.                                                         | Low airflow → nhiệt/độ mịn/khả năng nghiền ảnh hưởng. |\n\nCác mô hình của Line trao đổi dòng vật chất qua Process Graph; dòng hồi lưu và kho đệm được giải đồng thời với giới hạn nguồn cấp/đầu nhận.\n\n#### 10.5 Z03-L02 — Cement Mill B\n\nChuỗi vật liệu: WF-401B → CM-401B → SP-401B → SL-401; coarse recycle → CM-401B; FN-401B là nhánh khí\n\n| Thiết bị | Mô hình                     | Phép tính / đầu ra                                      | Fault tác động trực tiếp                               |\n|----------|-----------------------------|---------------------------------------------------------|--------------------------------------------------------|\n| WF-401B  | M01 M02 M13 M14             | Lưu lượng và recipe riêng cho B; không đồng nhất với A. | Feed deviation → chất lượng hoặc sản lượng B thay đổi. |\n| CM-401B  | M01 M02 M03 M05 M06 M13 M15 | Cùng dạng phương trình Mill A, state/parameter độc lập. | Mill B trip → chỉ B mất sản lượng tức thời.            |\n| SP-401B  | M01 M08 M13                 | D=F+R, P=αD, R=(1−α)D; holdup độc lập.                  | Separator B fault → recirculation B tăng.              |\n| FN-401B  | M03 M04 M10                 | Đặc tuyến fan B và tổn thất áp suất nhánh B.            | Fan B trip → B giảm công suất.                         |\n\nCác mô hình của Line trao đổi dòng vật chất qua Process Graph; dòng hồi lưu và kho đệm được giải đồng thời với giới hạn nguồn cấp/đầu nhận.\n\n#### 10.6 Z04-L01 — Bag Packing\n\nChuỗi vật liệu: SL-401 → FD-501 → PK-501 → BC-501 → LD-501\n\n| Thiết bị | Mô hình             | Phép tính / đầu ra                                                                | Fault tác động trực tiếp                       |\n|----------|---------------------|-----------------------------------------------------------------------------------|------------------------------------------------|\n| FD-501   | M01 M02 M14         | Qfeed=min(Qset,Qrated,Qavailable); valve/feeder permissive.                       | Feeder blockage → packer starvation.           |\n| PK-501   | M01 M02 M03 M15 M16 | Nbags/min≈nspouts·rpm·ηcycle; Qgood=N_good·mbag/1000 (t/h nếu N/h); reject riêng. | Bag jam/underweight → good bags↓, rejects↑.    |\n| BC-501   | M02 M03 M04 M12 M16 | Thời gian vận chuyển τ=L/v; đếm bao theo sự kiện, giới hạn mật độ.                | Conveyor trip → buffer đầy, packer interlock.  |\n| LD-501   | M02 M14 M16         | Nloaded tích lũy theo sự kiện, giới hạn xe và loading permissive.                 | Truck absent/loading failure → không xuất bao. |\n\nCác mô hình của Line trao đổi dòng vật chất qua Process Graph; dòng hồi lưu và kho đệm được giải đồng thời với giới hạn nguồn cấp/đầu nhận.\n\n#### 10.7 Z04-L02 — Bulk Loading\n\nChuỗi vật liệu: SL-401 → FD-502 → SP-502 → WS-502\n\n| Thiết bị | Mô hình         | Phép tính / đầu ra                                                           | Fault tác động trực tiếp                      |\n|----------|-----------------|------------------------------------------------------------------------------|-----------------------------------------------|\n| FD-502   | M01 M02 M14     | Qfeed=min(Qset,Qrated,Qavailable).                                           | Feeder jam → Qbulk↓.                          |\n| SP-502   | M02 M10 M14 M15 | Qloading theo spout lowered, permissive, năng lực và dust extraction.        | Spout misposition/dust fault → restrict/stop. |\n| WS-502   | M01 M14 M16     | Mtruck,next=Mtruck+Qloading·Δt/3600; stop khi đạt target (xét cutoff delay). | Scale fault/truck absent → pause hoặc stop.   |\n\nCác mô hình của Line trao đổi dòng vật chất qua Process Graph; dòng hồi lưu và kho đệm được giải đồng thời với giới hạn nguồn cấp/đầu nhận.\n\n#### 10.8 Shared Asset — SL-401 Cement Silo Bank\n\nM01 + M11 + M13 + M14. Với mỗi grade g: M\\[g\\]next=M\\[g\\]+Δt·(QA\\[g\\]+QB\\[g\\]−Qbag\\[g\\]−Qbulk\\[g\\])/3600. Không trộn các grade khác nhau vào cùng một tồn kho trừ khi mô hình hóa chuyển grade. Silo được sở hữu một lần và cấp cho cả hai tuyến Z04.\n\n### 11. Công thức nền tảng, đơn vị và tính nhất quán\n\n#### 11.1 Cân bằng khối lượng\n\nMnext=M+Δt·(ΣQin−ΣQout)/3600 với Q t/h, Δt s. Khi có phản ứng phải cân bằng từng species; CO₂ và hơi nước là các dòng ra hợp lệ, không được coi là khối lượng biến mất.\n\n#### 11.2 Cân bằng năng lượng\n\nUnew=Uold+Δt·(Σṁin hin−Σṁout hout+Q̇−Ẇ). Định nghĩa ranh giới và dấu nhất quán; nếu dùng MW, MJ và s thì 1 MW=1 MJ/s.\n\n#### 11.3 Capacity / buffer / two-phase update\n\nQtransfer≤min(source available/Δt, link capacity, destination acceptance/Δt). Giải/allocate tất cả dòng trước khi cập nhật silo để kết quả không phụ thuộc thứ tự duyệt equipment.\n\n#### 11.4 Độ ẩm và chất lượng\n\nWet-basis w=mwater/(mwater+mdry). Thành phần hóa học phải chỉ rõ dry basis / oxide basis; các tỷ lệ phải tổng 100% theo basis định nghĩa.\n\n#### 11.5 Sensor và fault\n\nPhysical truth → sensor lag/noise/bias → alarm. Fault thiết bị đổi η, Kpressure, fuel supply, actuator hoặc logic bảo vệ; fault sensor chỉ đổi measurement và có thể ảnh hưởng controller qua feedback.\n\n#### 11.6 Điều kiện trạng thái\n\nSTOPPED, STARTING, RUNNING, DERATED, WARNING, TRIPPED, RECOVERING; trạng thái được quyết định bởi lệnh, permissive, interlock, PV và timer; fault không tự động đồng nghĩa với trip.\n\n#### 11.7 Kiểm thử bắt buộc\n\nKiểm tra mass residual, energy residual, tồn kho không âm/không vượt max, phân loại sản phẩm, giới hạn actuator, response delay, restart interlock và fault propagation cả xuôi lẫn ngược.\n\n### 12. Ví dụ liên kết fault với mô hình\n\n#### Raw Mill high moisture\n\nTăng win tại RM-201 → M07 tăng ṁevap và Q̇drying → M02 giảm capacity nếu nhiệt sấy không đủ → M01 giảm raw meal → SL-301 inventory giảm → KF-301 thiếu feed khi xuống ngưỡng → Kiln giảm tải có độ trễ.\n\n#### Preheater cyclone blockage\n\nTăng hệ số trở lực K ở PH-301 → M10 tăng Δp/giảm Qgas → M05 thay đổi trao đổi nhiệt, M09 conversion tại PC-301 thay đổi → controller giảm kiln feed hoặc trip theo giới hạn.\n\n#### Cement Mill A trip\n\nCM-401A mất drive, Q_A→0 sau ramp; Mill B không tự tăng nếu không có logic phân bổ. SL-401 giảm tốc độ nhập, Packing/Bulk vẫn xuất đến khi silo cạn.\n\n#### Packing jam / downstream blockage\n\nPK-501 jam → bag output=0 → SL-401 tích lũy nếu Mill A/B tiếp tục → khi silo high-high, controller giảm/dừng mill → clinker silo tích lũy và có thể ảnh hưởng Kiln.\n\n### 13. Dữ liệu bắt buộc trước khi triển khai\n\nVới mỗi thiết bị: rated_capacity, operating_limits, initial_state, response_time, control setpoints, alarm/trip thresholds, material properties, calibration curves và fault severity/recovery. Với mỗi stream: source, destination, material, flow, temperature, composition, moisture, delay, capacity. Dữ liệu ví dụ không thay thế P&ID, OEM manual, DCS logic hoặc kết quả commissioning.\n\n---\n\n## 3.3. Kiến trúc thực thi mô phỏng và liên kết dữ liệu (đề xuất mới)\n\n> **Trạng thái:** Phần này là đề xuất thiết kế bổ sung, không phải nội dung được xác nhận từ tài liệu DOCX gốc và chưa được triển khai/kiểm thử. Mục 3.1 xác định *quy trình xảy ra như thế nào*; mục 3.2 xác định *thiết bị, công thức, thông số và fault*; mục 3.3 xác định *cách tổ chức dữ liệu và thực thi các mô hình đó trong simulator*.\n\n### 3.3.1. Hai cấu trúc song song: phân cấp quản lý và đồ thị công nghệ\n\n- **Hierarchy:** `Factory → Zone → Line → Process → Equipment → Component` để duyệt, gán quyền sở hữu, tìm kiếm và hiển thị chi tiết. Một Equipment có thể tham gia nhiều Process; do đó không nên suy ra quan hệ độc quyền từ cây phân cấp.\n- **Process Graph:** Các nút Process liên kết bằng luồng vật chất, năng lượng, điều khiển, thông tin và sự kiện. Các cạnh phải có định danh và hướng. Một Process có thể có nhiều thiết bị tham gia; một Equipment có thể được tham chiếu bởi nhiều Process.\n- **Equipment/Component Graph:** Mô tả kết nối chức năng bên trong cụm thiết bị (motor → gearbox → rotor; transmitter → controller → actuator), không mặc định tất cả thiết bị đều có motor.\n- **Asset ownership:** Mỗi Equipment có một `asset_id` duy nhất, kể cả khi tham gia nhiều Process. `SL-401` là tài sản dùng chung, chỉ tồn tại một lần trong inventory; các Line liên kết đến cùng `asset_id`.\n\n### 3.3.2. Các hợp đồng dữ liệu tối thiểu\n\n| Đối tượng | Trường bắt buộc đề xuất | Quan hệ |\n|---|---|---|\n| Zone | `id`, `name`, `function`, `inputs`, `outputs`, `line_ids` | Chứa nhiều Line |\n| Line | `id`, `zone_id`, `process_ids`, `input_ports`, `output_ports` | Chứa chuỗi/cụm Process |\n| Process | `id`, `function`, `input_ports`, `output_ports`, `equipment_ids`, `model_ids` | Nhiều-nhiều với Equipment |\n| Equipment | `id`, `type`, `component_ids`, `parameter_set`, `state`, `model_ids`, `fault_ids` | Một asset, nhiều Process |\n| Component | `id`, `equipment_id`, `type`, `inputs`, `outputs`, `measurements` | Thuộc một asset |\n| Stream | `id`, `source_port`, `target_port`, `kind`, `quantity`, `unit`, `delay` | Cạnh có hướng |\n| Model instance | `id`, `model_type`, `target_id`, `parameters`, `state_variables`, `inputs`, `outputs` | Áp dụng cho Process hoặc Equipment |\n| Fault scenario | `id`, `target_id`, `onset`, `severity`, `duration`, `parameter_effects`, `recovery` | Tác động qua tham số/trạng thái |\n\n`kind` của port/stream gồm `material`, `energy`, `control`, `information`, `event`. Mọi đại lượng phải ghi đơn vị, cơ sở tính (wet/dry basis khi liên quan), giới hạn hợp lệ và nguồn dữ liệu (measured/calculated/setpoint/internal).\n\n### 3.3.3. Ví dụ liên kết Process – Equipment – Model\n\nQuy ước mã công đoạn cho Z01 – L02 Raw Milling:\n\n| Mã | Process | Thiết bị tham gia |\n|---|---|---|\n| P01 | Dosing | WF-201 |\n| P02 | Grinding & Drying | RM-201; FN-201 hỗ trợ dòng khí |\n| P03 | Classification & Recirculation | SP-201; RM-201 nhận dòng hồi lưu |\n| P04 | Gas Handling | FN-201 |\n\nNghiền và sấy diễn ra đồng thời trong P02. Trong mô hình dữ liệu, `grinding` và `drying` là hai phép tính thuộc cùng Process ID `Z01-L02-P02`.\n\n```yaml\nprocess:\n  id: Z01-L02-P02\n  name: Grinding & Drying\n  equipment_ids: [RM-201, FN-201]\n  model_ids: [M01, M02, M05, M06, M07, M10]\n  input_ports: [wet_raw_mix, hot_gas, coarse_return]\n  output_ports: [ground_material_to_separator, humid_exhaust]\n\nequipment:\n  id: RM-201\n  type: vertical_raw_mill\n  participates_in: [Z01-L02-P02, Z01-L02-P03]\n  components: [grinding_table, grinding_rollers, main_drive, hydraulic_system]\n\nstream:\n  id: RAW_MEAL_TO_SILO\n  source_port: Z01-L02.raw_meal_out\n  target_port: SL-301.raw_meal_in\n  kind: material\n  unit: t/h\n```\n\nP03 phân ly liệu đã nghiền từ P02 và đưa phần hạt thô trở lại RM-201. Luồng `RAW_MEAL_TO_SILO` mang phần bột liệu đạt yêu cầu từ đầu ra của dây chuyền đến SL-301.\n\n### 3.3.4. Chu kỳ tính toán mô phỏng\n\n1. Đọc thời gian mô phỏng, lệnh vận hành, recipe và kịch bản fault đến hạn.\n2. Áp dụng fault vào **tham số vật lý hoặc trạng thái thiết bị** (ví dụ hiệu suất quạt, hệ số nghẹt, khả năng cấp liệu); không ghi đè tùy tiện PV để tạo sự cố giả.\n3. Đánh giá permissive, interlock, alarm/trip và các lệnh điều khiển. Xác định setpoint có hiệu lực.\n4. Tính giới hạn năng lực và phân bổ lưu lượng theo nguồn cấp, tải máy, tồn kho, đường hồi lưu và khả năng nhận của downstream.\n5. Giải các nhóm mô hình liên kết: cân bằng vật chất, nhiệt, khí, phản ứng, chất lượng và công suất; lặp hội tụ khi có vòng recycle hoặc ghép mạnh.\n6. Cập nhật trạng thái động học/tồn kho theo bước thời gian và giới hạn vật lý; tránh dùng giá trị mới của một nút và giá trị cũ của nút khác trong cùng một bước tính.\n7. Tạo phép đo giả lập từ trạng thái thật của mô hình (sensor lag, noise, quality flag), sau đó publish telemetry/event.\n8. Kiểm tra bất biến, ghi nhật ký và lưu snapshot phục vụ tái lập kịch bản.\n\n**Lưu ý kỹ thuật:** Tách `physical_state`, `measured_value`, `setpoint`, `alarm_state`; tách đơn vị t/h với kg/s và bước thời gian giây. Dùng cơ chế tính hai pha hoặc solver đồ thị để giảm sai lệch do thứ tự cập nhật. Chu kỳ solver, tốc độ UI và tần suất telemetry không nhất thiết bằng nhau.\n\n### 3.3.5. Quan hệ nhân quả và lan truyền fault\n\nMỗi fault cần mô tả `root_cause → parameter_change → physical_response → sensor_response → control_response → downstream_effect`, kèm thời gian trễ và điều kiện tồn kho.\n\n**Ví dụ – FN-201 giảm năng lực:** hiệu suất/tốc độ quạt giảm → lưu lượng khí giảm → khả năng sấy của RM-201 giảm → độ ẩm raw meal tăng hoặc hệ điều khiển giảm feed → chất lượng/lưu lượng vào `SL-301` thay đổi → tác động đến Kiln chỉ khi bộ đệm tồn kho hoặc giới hạn chất lượng bị vượt qua. Không mặc định Kiln dừng ngay.\n\n**Ví dụ – PK-501 kẹt bao:** sản lượng đóng bao giảm về 0 → `SL-401` có thể tăng tồn kho nếu các mill tiếp tục chạy → khi đạt ngưỡng bảo vệ, điều khiển giảm/dừng cấp từ mill → tác động ngược về tồn kho clinker; nhánh Bulk Loading có thể tiếp tục nếu điều kiện riêng vẫn đáp ứng.\n\n### 3.3.6. Trạng thái, điều khiển và telemetry\n\nBiểu diễn trạng thái thiết bị bằng ba trường độc lập. `STOPPED` là giá trị chuẩn cho thiết bị không vận hành.\n\n| Trường | Giá trị | Ý nghĩa |\n|---|---|---|\n| `operating_state` | `STOPPED` | Thiết bị không vận hành. |\n| `operating_state` | `STARTING` | Đang khởi động. |\n| `operating_state` | `RUNNING` | Đang vận hành. |\n| `operating_state` | `STOPPING` | Đang dừng. |\n| `operating_state` | `TRIPPED` | Dừng do bảo vệ. |\n| `health_state` | `DEGRADED` | Tình trạng thiết bị suy giảm. |\n| `health_state` | `FAULTED` | Có lỗi được xác nhận. Lỗi có thể phát cảnh báo khi thiết bị vẫn chạy hoặc kích hoạt bảo vệ và chuyển thiết bị sang `TRIPPED`. |\n| `capacity_limitation` | `DERATED` | Công suất hoặc năng suất khả dụng bị giới hạn. |\n\nVí dụ: RM-201 vẫn đang chạy, có cảnh báo rung cao và bị giới hạn còn 70% năng suất danh định. Biểu diễn bằng `operating_state: RUNNING`, `health_state: DEGRADED` và `capacity_limitation: DERATED`, kèm mức giới hạn 70%.\n\n- **Thiết bị thụ động:** Theo dõi trạng thái tồn kho và cửa xả đối với silo.\n- **Process state:** `IDLE`, `READY`, `ACTIVE`, `STARVED`, `BLOCKED`, `DEGRADED`, `STOPPED`.\n- **Control:** ghi rõ `mode`, `setpoint`, `feedback`, `actuator_output`, `permissives`, `interlocks`, `trip_reason`, `reset_condition`.\n- **Telemetry:** mỗi tag có `tag_id`, `asset_id`, `value`, `unit`, `timestamp`, `quality`, `source_type` và `sample_period`; không xem tag calculated là cảm biến thực.\n- **Event log:** ghi thời điểm, nguồn, severity, trước/sau khi thay đổi và liên kết đến fault hoặc thao tác vận hành.\n\n### 3.3.7. Kiểm thử chấp nhận trước khi kết nối UI\n\n| Nhóm test | Điều kiện đạt đề xuất |\n|---|---|\n| Topology | 4 Zone, 7 Line, 33 Equipment logic; `SL-401` chỉ có một inventory |\n| Referential integrity | Mọi Process, Equipment, Model, Fault và Stream tham chiếu ID hợp lệ |\n| Mass conservation | Cân bằng tổng và thành phần trong sai số số học đã định nghĩa; CO₂/hơi nước được tính ở đúng biên |\n| Energy consistency | Không tạo nhiệt/công suất vô lý; đơn vị và cơ sở tính nhất quán |\n| Capacity/inventory | Không có tồn kho âm hoặc vượt giới hạn mà không phát sinh trạng thái bảo vệ |\n| Recycle stability | Vòng separator hội tụ hoặc báo không hội tụ rõ ràng |\n| Fault propagation | Tác động theo quan hệ vật lý và thời gian trễ; không nhảy trạng thái vô cớ |\n| Reproducibility | Cùng cấu hình, seed và event schedule tạo cùng kết quả trong sai số xác định |\n| UI navigation | Click Zone/Line/Process/Equipment/Model/Fault mở đúng chi tiết; có fallback khi JS lỗi |\n\n### 3.3.8. Ranh giới V1 và thứ tự triển khai đề xuất\n\n1. Chuẩn hóa định danh, topology, input/output port và material properties.\n2. Cài đặt mô hình cân bằng vật chất, giới hạn công suất, vận chuyển và silo trước.\n3. Bổ sung nghiền/sấy/phân ly và recycle; tiếp theo là nhiệt, phản ứng và dòng khí cho Kiln.\n4. Bổ sung điều khiển, interlock, fault và sensor/telemetry.\n5. Tạo bộ test vật lý, integration test và scenario test; cuối cùng mới kết nối Engineering Explorer/SCADA.\n\n**Ngoài phạm vi đã xác nhận:** mô phỏng khai thác mỏ, toàn bộ utilities, P&ID/OEM chi tiết và mô hình động học cấp cao chưa hiệu chỉnh. Không diễn giải các thông số giả định thành thông số nhà máy thật.\n---\n\n## 4. Trạng thái triển khai\n\nTài liệu là **đặc tả mô phỏng**, chưa phải bằng chứng hệ thống simulation đã chạy. Engineering Explorer HTML là công cụ duyệt kiến trúc; dữ liệu mô phỏng, phương trình đã hiệu chỉnh, điều khiển thời gian thực và kiểm thử end-to-end là các phần cần triển khai/kiểm chứng riêng.\n";

function table(headers,rows) {
  if (!rows.length) return '';
  return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function markdown(text) {
  const lines = text.split(/\r?\n/);
  let out = '', code = null;
  const inline = text => esc(text).replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  for (let i=0;i<lines.length;i++) {
    const line = lines[i];
    if (line.startsWith('\x60\x60\x60')) {
      if (code === null) code = [];
      else { out += '<pre><code>'+esc(code.join('\n'))+'</code></pre>'; code = null; }
    } else if (code) code.push(line);
    else if (line.startsWith('|') && /^\|[\s:-]+(?:\|[\s:-]+)+\|?\s*$/.test(lines[i+1] || '')) {
      let end = i+2;
      while (lines[end]?.startsWith('|')) end++;
      const rows = tableRows([line,...lines.slice(i+2,end)].join('\n'));
      out += table(rows[0], rows.slice(1));
      i=end-1;
    } else {
      const heading = line.match(/^(#{1,6})\s+(.*)/);
      if (heading) {
        const level = Math.max(2,heading[1].length);
        out += '<h'+level+'>'+inline(heading[2])+'</h'+level+'>';
      } else if (/^---+$/.test(line)) out += '<hr>';
      else if (/^(?:- |\d+\. )/.test(line)) {
        const pattern = line.startsWith('- ') ? /^- (.*)/ : /^\d+\. (.*)/;
        const tag = line.startsWith('- ') ? 'ul' : 'ol';
        out += '<'+tag+'>';
        while (i<lines.length && pattern.test(lines[i])) {
          out += '<li>'+inline(lines[i].match(pattern)[1])+'</li>';
          i++;
        }
        i--;
        out += '</'+tag+'>';
      }
      else if (line.trim()) out += '<p>'+inline(line.replace(/^>\s*/,''))+'</p>';
    }
  }
  return out;
}

function moveOperationWindow(windowEl,x,y) {
  const bounds=windowEl.getBoundingClientRect();
  const gap=8;
  const limit=(position,span,viewport)=>Math.max(gap,Math.min(position,viewport-span-gap));
  windowEl.style.left=limit(x,bounds.width,window.innerWidth)+'px';
  windowEl.style.top=limit(y,bounds.height,window.innerHeight)+'px';
  windowEl.style.bottom='auto';
}
function setupOperationDrag(windowEl) {
  let pointer=null;
  windowEl.addEventListener('pointerdown',e=>{
    if (!e.isPrimary || e.button!==0 || !e.target.closest('[data-operation-handle]') || e.target.closest('button')) return;
    const bounds=windowEl.getBoundingClientRect();
    pointer={id:e.pointerId,x:e.clientX-bounds.left,y:e.clientY-bounds.top};
    windowEl.setPointerCapture(e.pointerId);
  });
  windowEl.addEventListener('pointermove',e=>{
    if (pointer?.id===e.pointerId) moveOperationWindow(windowEl,e.clientX-pointer.x,e.clientY-pointer.y);
  });
  windowEl.addEventListener('lostpointercapture',()=>{pointer=null;});
  const keepVisible=()=>{
    if (!windowEl.hidden && windowEl.style.left) moveOperationWindow(windowEl,windowEl.offsetLeft,windowEl.offsetTop);
  };
  window.addEventListener('resize',keepVisible);
  new ResizeObserver(keepVisible).observe(windowEl);
}

function showSimulationFrame() {
  const target=$('simulation-values');
  if (!target) return;
  if (location.protocol==='file:') {
    target.innerHTML=note('Mở Explorer qua máy chủ Python để xem thông số vận hành.');
    return;
  }
  const frame=simulation.frame;
  if (!frame) {
    target.textContent=simulation.error || 'Đang tải thông số vận hành…';
    return;
  }
  const readings=frame.measurements[simulation.asset];
  if (!readings) {
    target.innerHTML=note('Thiết bị chưa có dữ liệu trong lượt chạy này.');
    return;
  }
  const rows=simulation.tags.filter(tag=>tag.device_id===simulation.asset && tag.visible)
    .map(tag=>{
      const raw=readings[tag.tag_id];
      const value=typeof raw==='number'?simulationNumber.format(raw):
        typeof raw==='boolean'?(raw?'Có':'Không'):(operationLabels[raw] || raw);
      return [tag.label,value==null?'—':String(value)+(tag.unit?' '+tag.unit:'')];
    });
  target.innerHTML=table(['Thông số','Giá trị đo'],rows);
}

function updateFaultControls() {
  const controls=$('simulation-faults');
  if (!controls) return;
  controls.disabled=!simulation.frame;
  const inject=controls.querySelector('[data-inject-faults]');
  if (inject) inject.disabled=simulation.loading;
  controls.querySelector('[data-reset-operation]').disabled=simulation.loading;
  for (const input of controls.querySelectorAll('input[name="simulation-fault"]')) {
    const active=simulation.faults.has(input.value);
    input.disabled=active;
    if (active) input.checked=true;
    controls.querySelector('[data-fault-status="'+input.value+'"]').textContent=active?'Đang áp dụng':'';
  }
  $('simulation-feedback').textContent=simulation.error || (simulation.loading?'Đang tính mô phỏng…':'');
}

async function loadOperation(faults=[], reset=false) {
  if (simulation.loading) return;
  simulation.loading=true;
  simulation.error='';
  updateFaultControls();
  showSimulationFrame();
  try {
    const response=await fetch('/api/live-operation',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session:simulation.session,faults,reset})
    });
    if (!response.ok) throw new Error('Simulation request failed');
    const result=await response.json();
    if (reset || simulation.session!==result.session) simulation.faults.clear();
    simulation.session=result.session;
    simulation.frame=result.frame;
    simulation.tags=result.tags;
    for (const fault of faults) simulation.faults.add(fault);
  } catch {
    simulation.error='Không tải được dữ liệu mô phỏng. Kiểm tra máy chủ Python rồi thử lại.';
  } finally {
    simulation.loading=false;
    refreshSimulation();
  }
}

function refreshSimulation() {
  showLiveEquipmentState();
  showSimulationFrame();
  updateFaultControls();
}

function showLiveEquipmentState() {
  if (!simulation.frame || demoState.enabled) return;
  for (const node of $('canvas').querySelectorAll('[data-node]')) {
    const id=node.dataset.node;
    const measurements=simulation.frame.measurements;
    const assets=measurements[id]?[id]:(record.get(id)?.equipment || []);
    const states=assets.flatMap(key=>{
      const tags=simulation.tags.filter(tag=>tag.device_id===key && tag.source.section==='equipment');
      const run=tags.find(tag=>tag.source.transform==='run');
      const trip=tags.find(tag=>tag.source.transform==='trip');
      if (!run || !trip || !measurements[key]) return [];
      return [[key,measurements[key][trip.tag_id]?'TRIPPED':measurements[key][run.tag_id]?'RUNNING':'STOPPED']];
    });
    node.classList.toggle('live-running',states.length>0 && states.every(([,state])=>state==='RUNNING'));
    node.classList.toggle('live-trip',states.some(([,state])=>state==='TRIPPED'));
    if (states.length) node.querySelector('title').textContent=states.map(([key,state])=>
      key+' · '+(operationLabels[state] || state)).join('\n');
  }
}

  return specification.slice(start).split(new RegExp('^#{1,'+level+'} ', 'm'))[0].trim();

  return '<h3>Điều khiển và bảo vệ theo thiết bị</h3>'+
    zones.map(([label,assets])=>technicalDetails(label,assets.map(d=>
      '<section><div class="links">'+codeLink(d.id)+'</div>'+para(equipmentProtection(d))+'</section>'
    ).join(''))).join('')+
    technicalDetails('Trạng thái thiết bị, điều khiển và telemetry · 3.3.6',markdown(specificationSection('### 3.3.6.')))+
    technicalDetails('Alarm, trip và cấu hình tag · 3.2',markdown(specificationSection('### 8. Chuẩn trạng thái')))+
    technicalDetails('Các vòng điều khiển tham khảo từ Explorer cũ',preserveLegacyControl())+
    note('Ngưỡng alarm/trip và logic an toàn cần dữ liệu OEM hoặc thiết kế đã thẩm định.');
}

function faultLibrary() {
  const entries=list('Fault');
  return '<h3>Lan truyền theo khu vực</h3>'+
    list('Zone').map(z=>technicalDetails(z.id+' · '+z.name,cards(entries.filter(f=>f.id.startsWith('fault:spec:') && f.zone===z.id)))).join('')+
    technicalDetails('Lỗi theo thiết bị',list('Equipment').filter(d=>d.faultIds.some(id=>/^[A-Z0-9-]+-F\d+$/.test(id))).map(d=>
      technicalDetails(d.id+' · '+d.name,cards(d.faultIds.filter(id=>/^[A-Z0-9-]+-F\d+$/.test(id)).map(id=>record.get(id))))
    ).join(''))+
    technicalDetails('Kịch bản kiểm thử SC-01–SC-12',cards(entries.filter(f=>f.id.startsWith('SC-'))))+
    technicalDetails('Phân loại và quy tắc lan truyền · 3.2',markdown(specificationSection('### 6. Fault taxonomy')))+
    technicalDetails('Quan hệ nhân quả, tồn kho và độ trễ · 3.3.5',markdown(specificationSection('### 3.3.5.')))+
    technicalDetails('Ví dụ liên kết lỗi với mô hình · 3.2',markdown(specificationSection('### 12. Ví dụ')))+
    technicalDetails('Chuỗi định tính từ Explorer cũ',cards(entries.filter(f=>f.reference)));
}

function referenceLibrary() {
  const sections=specification.split(/(?=^## (?:[124]\. |3\. |3\.[123]\. ))/m);
  return '<p><a href="../Specification.md">Mở tệp Markdown nguồn</a></p>'+
    markdown(sections.shift())+sections.map(section=>{
      const index=section.indexOf('\n');
      return technicalDetails(section.slice(0,index).replace(/^## /,''),markdown(section.slice(index+1)));
    }).join('');
}

function libraryView(d) {
  const panel = content => '<div class="reference">'+content+'</div>';
  if (d.type === 'Model') {
    const equipment = list('Equipment').filter(eq=>eq.models.includes(d.id) && eq.matrix);
    return panel('<h3>Phép tính đại diện · 3.1</h3>'+para(d.formula)+para(d.application)+
      '<h3>Phép tính theo thiết bị · 3.2</h3>'+
      equipment.map(eq=>technicalDetails(eq.id+' · '+eq.name,'<div class="links">'+codeLink(eq.id)+'</div>'+para(eq.matrix[2]))).join('')+
      technicalDetails('Công thức nền tảng và đơn vị',markdown(specificationSection('### 11. Công thức')))+
      technicalDetails('Phương trình tham khảo từ Explorer cũ',para(d.legacyFormula))+
      note('Đặc tả chưa có từ điển biến, đơn vị và điều kiện biên đầy đủ cho từng mô hình. Hiệu chỉnh hệ số trước khi dùng trong bộ mô phỏng.'));
  }
  if (d.id==='models') {
    const models=list('Model');
    return panel('<h3>Vật lý và chất lượng · M01–M13</h3>'+cards(models.slice(0,13))+
      '<h3>Điều khiển, suy giảm và sự kiện · M14–M16</h3>'+cards(models.slice(13))+
      technicalDetails('Công thức nền tảng và đơn vị',markdown(specificationSection('### 11. Công thức'))));
  }
  if (d.id==='faults') return panel(faultLibrary());
  if (d.id==='controls') return panel(controlLibrary());
  return panel(referenceLibrary());
}

function renderNotes(d) {
  const notes = [];
  if (demoState.enabled) {
    const text = {normal:'Dòng vật liệu, mức silo và trạng thái hiển thị là minh họa.',idle:'BC-501 ở trạng thái STOPPED để quan sát nhánh đóng bao.',fan:'FN-201 giảm lưu lượng. RM-201 giảm khả năng sấy; ảnh hưởng phía lò phụ thuộc tồn kho và chất lượng tại SL-301.'}[demoState.scenario];
    notes.push('<div class="callout"><strong>DEMO MODE · Giá trị minh họa</strong>'+para(text)+(isFaultDemo()?'<div class="links">'+link('fault:1','Xem chuỗi lan truyền')+'</div>':'')+'</div>');
  }
  if (d.id===factory) notes.push(note('Chọn khu vực hoặc dây chuyền để xem chi tiết. Tên trên các mũi tên cho biết vật liệu, dòng khí hoặc nhiệt đang được trao đổi.'));
  if (d.id==='Z01-L02') notes.push('<div class="callout">Mã P04 lấy theo mục 3.3.3. Mục 3.1 dùng P04 cho Chuyển bột liệu; nội dung này hiển thị trên tuyến từ phân ly đến SL-301.<div class="links">'+link(rawTransfer)+'</div></div>');
  if (d.type==='Process' || d.type==='Stream') {
    if (d.body) notes.push('<details class="note"><summary>Bảng công đoạn trong đặc tả</summary>'+markdown(d.body)+'</details>');
    if (d.id==='Z01-L02-P02') notes.push(note('Nghiền và sấy diễn ra đồng thời trong RM-201. FN-201 hỗ trợ lưu lượng khí cho quá trình sấy.'));
  }
  if (d.type==='Equipment') {
    notes.push('<details class="note"><summary>Hồ sơ thiết bị trong đặc tả</summary>'+markdown(d.body)+'</details>');
    notes.push('<details class="note"><summary>Dữ liệu bổ sung từ Explorer cũ</summary>'+table(['Mục','Thông tin tham khảo'],[['Chức năng',d.legacy[1]],['Đầu vào / năng lượng',d.legacy[2]],['Đầu ra',d.legacy[3]],['Component',d.legacy[4]],['Thông số',d.legacy[5]],['Fault',d.legacy[6]]])+'</details>');
  }
  if (d.type==='Zone') {
    const dependency = {
      Z01:'BN-101 đệm nguyên liệu thu hồi. Năng lực sấy phụ thuộc lưu lượng khí và nguồn nhiệt.',
      Z02:'SL-301 đệm cấp liệu cho lò. Draft, thu hồi nhiệt ở cooler và sức chứa SL-302 ảnh hưởng năng suất hệ nung.',
      Z03:'Mill A và B nhận clinker từ SL-302. Khả năng nhận theo mác ở SL-401 có thể giới hạn đầu ra của cả hai tuyến.',
      Z04:'Hai tuyến cùng nhận xi măng từ SL-401. Điều kiện xe, cân và trạng thái thiết bị quyết định khả năng xuất của mỗi tuyến.'
    }[d.id];
    notes.push(note(dependency));
  }
  if (d.type==='Line') notes.push('<details class="note"><summary>Mô tả chi tiết từ Explorer cũ · tham khảo</summary>'+table(['Hoạt động','Chức năng','Đầu vào','Đầu ra','Thiết bị'],d.legacyStages.map(([...s])=>[...s.slice(0,4),s[4].join(', ')]))+'</details>');
  $('canvas-notes').innerHTML=notes.join('');
}

const layerNames = {material:'Vật liệu',gas:'Khí',heat:'Nhiệt',recycle:'Hồi lưu',control:'Điều khiển'};
function renderToolbar() {
  $('toolbar').hidden=!currentDiagram;
  $('toolbar').innerHTML='<button data-action="zoom-out" aria-label="Thu nhỏ">−</button><button data-action="zoom-in" aria-label="Phóng to">+</button><button data-action="reset">Đặt lại góc nhìn</button>'+
    Object.entries(layerNames).map(([key,label])=>'<button data-layer-toggle="'+key+'" aria-pressed="'+layers.has(key)+'">'+label+'</button>').join('')+
    (demoState.enabled?'<select id="scenario" aria-label="Kịch bản demo"><option value="normal">Sản xuất bình thường</option><option value="idle">Băng bao dừng</option><option value="fan">Suy giảm quạt nghiền liệu</option></select>':'');
  if ($('scenario')) $('scenario').value=demoState.scenario;
  $('legend').innerHTML=currentDiagram?Object.entries({raw:'Nguyên liệu',meal:'Bột liệu',clinker:'Clinker',cement:'Xi măng',gas:'Khí',heat:'Nhiệt',recycle:'Hồi lưu',control:'Điều khiển'}).map(([kind,label])=>'<span><i style="--c:'+flowColors[kind]+'"></i>'+label+'</span>').join(''):'';
}
function applyLayers() {
  $('canvas').querySelectorAll('[data-layer]').forEach(el=>el.style.display=layers.has(el.dataset.layer)?'':'none');
  $('toolbar').querySelectorAll('[data-layer-toggle]').forEach(el=>el.setAttribute('aria-pressed',layers.has(el.dataset.layerToggle)));
}
function ancestors(id) {
  const chain = [];
  while (record.has(id)) {
    chain.unshift(id);
    id=record.get(id).parent;
  }
  return chain;
}
let treePath = [factory];
const expandedBranches = new Set([factory]);
const factoryLabel = 'Factory Overview';
function hierarchyPath(d) {
  if (d.type==='Component') return [...hierarchyPath(record.get(d.parent)),d.id];
  if (d.id==='SL-401') return [factory,'Z04',d.id];
  if (d.type!=='Equipment') return ancestors(d.id);
  // Keep the selected process when an asset participates in more than one.
  const process = d.processes.find(id=>treePath.includes(id)) ||
    d.processes.find(id=>record.get(id).parent===d.parent) || d.processes[0];
  return process ? [...ancestors(process),d.id] : ancestors(d.id);
}
function treeChildren(d) {
  switch(d.type) {
    case 'Factory': return list('Zone');
    case 'Zone': return d.id==='Z04' ? [...list('Line',d.id),record.get('SL-401')] : list('Line',d.id);
    case 'Line': return stages(d.id);
    case 'Process': return d.equipment.map(id=>record.get(id));
    case 'Equipment': return list('Component',d.id);
    default: return [];
  }
}
function renderTree(d) {
  const tree=$('tree');
  const focused=tree.contains(document.activeElement);
  const selectedBranch=treePath.join('/');
  const branch=(item,parentPath)=>{
    const path=[...parentPath,item.id];
    const key=path.join('/');
    const children=treeChildren(item);
    const expanded=expandedBranches.has(key);
    const label=item.id===factory ? factoryLabel : item.type==='Component' ? item.name :
      (['Line','Process'].includes(item.type) ? item.id.slice(-3) : item.id)+' '+item.name;
    const button=link(item.id,label,'nav-item').replace('<button ','<button '+
      'data-tree-path="'+esc(key)+'" '+
      (key===selectedBranch?'aria-current="true" ':'')+
      (children.length?'aria-expanded="'+expanded+'" ':''));
    return button+(expanded && children.length ?
      '<div class="tree-children">'+children.map(child=>branch(child,path)).join('')+'</div>' : '');
  };
  tree.innerHTML=branch(record.get(factory),[]);
  if (focused) tree.querySelector('[aria-current="true"]')?.focus({preventScroll:true});
  $('libraries').querySelectorAll('[data-go]').forEach(button=>{
    if (button.dataset.go===d.id) button.setAttribute('aria-current','true');
    else button.removeAttribute('aria-current');
  });
}
function render(id,preserveCamera=false,branchKey) {
  const d=record.get(id);
  if (!d) return false;
  try {
    if (!preserveCamera) simulation.asset=d.type==='Equipment' && simulation.asset!==id ? id : null;
    selected=id;
    const chain=branchKey ? branchKey.split('/') : hierarchyPath(d);
    treePath=chain;
    if (branchKey && treeChildren(d).length) {
      if (expandedBranches.has(branchKey)) expandedBranches.delete(branchKey);
      else expandedBranches.add(branchKey);
    } else if (!branchKey && !preserveCamera) {
      for (let i=1;i<=chain.length;i++) {
        if (treeChildren(record.get(chain[i-1])).length) expandedBranches.add(chain.slice(0,i).join('/'));
      }
    }
    $('crumbs').innerHTML=chain.map((key,i)=>i===chain.length-1?'<span aria-current="page">'+esc(key===factory?factoryLabel:title(key))+'</span>':link(key,key===factory?factoryLabel:title(key))).join('<span aria-hidden="true">›</span>');
    $('canvas-heading').innerHTML='<div><span class="eyebrow">'+esc(d.type==='Factory'?'Sơ đồ công nghệ':typeLabel[d.type])+'</span><h2>'+esc(d.name)+'</h2>'+
      (d.type==='Factory'?'<p>Từ nguyên liệu đầu vào đến xi măng bao và xi măng rời</p>':'')+'</div>'+
      (d.type==='Factory'?'<div class="counts"><span class="tag">4 ZONES</span><span class="tag">7 LINES</span><span class="tag">33 EQUIPMENT</span></div>':'');
    currentDiagram=graphFor(d);
    if (!preserveCamera) camera=null;
    $('canvas').innerHTML=currentDiagram?svgDiagram(currentDiagram):libraryView(d);
    renderToolbar();
    applyLayers();
    if (camera && currentDiagram) setCamera();
    renderInspector(d);
    renderOperationWindow();
    renderNotes(d);
    renderTree(d);
    return true;
  } catch(error) {
    console.error(error);
    $('canvas').innerHTML=note('Không thể hiển thị sơ đồ này. Hãy chọn một mục khác hoặc mở Đặc tả kỹ thuật.');
    $('inspector').innerHTML='<h2>'+esc(d.name)+'</h2>'+note('Có lỗi khi đọc hồ sơ. Nội dung nguồn có trong Đặc tả kỹ thuật.');
    return false;
  }
}

function setCamera() {
  $('diagram')?.setAttribute('viewBox',[camera.x,camera.y,camera.w,camera.h].join(' '));
}
function getCamera() {
  return camera || {x:0,y:0,w:currentDiagram.width,h:currentDiagram.height};
}
function zoom(factor,pt) {
  if (!currentDiagram) return;
  const c=getCamera();
  if (c.w*factor<currentDiagram.width*.22 || c.w*factor>currentDiagram.width*2.4) return;
  const focus=pt || {x:c.x+c.w/2,y:c.y+c.h/2};
  camera={x:focus.x+(c.x-focus.x)*factor,y:focus.y+(c.y-focus.y)*factor,w:c.w*factor,h:c.h*factor};
  setCamera();
}
function canvasPoint(svg,x,y) {
  return new DOMPoint(x,y).matrixTransform(svg.getScreenCTM().inverse());
}
function highlight(id) {
  if (!currentDiagram) return;
  const connected=new Set([id]);
  $('canvas').querySelectorAll('[data-edge]').forEach(g=>{
    const {from,to,layer}=g.dataset;
    const matches=from===id || to===id || (record.get(id)?.type==='Zone' && [from,to].some(key=>key.startsWith(id+'-')));
    if (matches && layers.has(layer)) {
      connected.add(from);
      connected.add(to);
    }
    g.querySelector('.edge-line').classList.toggle('match',matches);
    g.querySelector('.edge-line').classList.toggle('dim',!!id && !matches);
  });
  $('canvas').querySelectorAll('[data-node]').forEach(n=>n.classList.toggle('match',connected.has(n.dataset.node)));
}
let drag=null, suppressClick=false;
function setupEvents() {
  setupOperationDrag($('operation-window'));
  $('operation-window').addEventListener('click',e=>{
    if (e.target.closest('[data-simulation-close]')) {
      simulation.asset=null;
      renderOperationWindow();
    } else if (e.target.closest('[data-inject-faults]') && simulation.frame && !simulation.loading) {
      const selectedFaults=[...$('simulation-faults').querySelectorAll('input:checked:not(:disabled)')];
      if (!selectedFaults.length) {
        $('simulation-feedback').textContent='Chọn ít nhất một lỗi để áp dụng.';
        return;
      }
      loadOperation(selectedFaults.map(input=>input.value));
    } else if (e.target.closest('[data-reset-operation]') && !simulation.loading) {
      for (const input of $('simulation-faults').querySelectorAll('input')) input.checked=false;
      loadOperation([],true);
    }
  });
  document.addEventListener('click',e=>{
    const action=e.target.closest('[data-go]');
    if (action && !suppressClick) {
      $('results').hidden=true;
      render(action.dataset.go,false,action.dataset.treePath);
      return;
    }
    if (!e.target.closest('.header-actions')) $('results').hidden=true;
  });
  document.addEventListener('keydown',e=>{
    if (e.key==='Escape') {
      $('results').hidden=true;
      simulation.asset=null;
      renderOperationWindow();
      return;
    }
    const node=e.target.closest('svg [data-go]');
    if (node && (e.key==='Enter' || e.key===' ')) {
      e.preventDefault();
      render(node.dataset.go);
    }
  });
  $('search').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    $('results').hidden=!q;
    if (!q) return;
    const searchText = d => [d.id,d.name,d.fn,d.parent,d.type].join(' ').toLowerCase();
    const found = [...record.values()].filter(d=>searchText(d).includes(q))
      .sort((a,b)=>Number(!a.id.toLowerCase().startsWith(q))-Number(!b.id.toLowerCase().startsWith(q))).slice(0,35);
    $('results').innerHTML=found.length?found.map(d=>link(d.id,d.id+' · '+d.name+' · '+typeLabel[d.type])).join(''):para('Không tìm thấy đối tượng.');
  });
  $('pause').addEventListener('click',()=>{
    paused=!paused;
    document.body.classList.toggle('paused',paused);
    $('pause').setAttribute('aria-pressed',paused);
    $('pause').textContent=paused?'Tiếp tục':'Tạm dừng';
  });
  $('demo').addEventListener('click',()=>{
    demoState.enabled=!demoState.enabled;
    document.body.classList.toggle('demo-off',!demoState.enabled);
    $('demo').setAttribute('aria-pressed',demoState.enabled);
    render(selected,true);
  });
  $('toolbar').addEventListener('change',e=>{
    if (e.target.id==='scenario') {
      demoState.scenario=e.target.value;
      render(selected,true);
    }
  });
  $('toolbar').addEventListener('click',e=>{
    const b=e.target.closest('button');
    if (!b) return;
    if (b.dataset.layerToggle) {
      const key=b.dataset.layerToggle;
      if (layers.has(key)) layers.delete(key); else layers.add(key);
      applyLayers();
    } else if (b.dataset.action==='zoom-in') zoom(.82);
    else if (b.dataset.action==='zoom-out') zoom(1.22);
    else if (b.dataset.action==='reset') {
      camera={x:0,y:0,w:currentDiagram.width,h:currentDiagram.height};
      setCamera();
    }
  });
  const canvas=$('canvas');
  canvas.addEventListener('pointerover',e=>highlight(e.target.closest('[data-node]')?.dataset.node));
  canvas.addEventListener('pointerleave',()=>highlight());
  canvas.addEventListener('focusin',e=>highlight(e.target.closest('[data-node]')?.dataset.node));
  canvas.addEventListener('focusout',()=>highlight());
  canvas.addEventListener('wheel',e=>{
    const svg=$('diagram');
    if (!svg) return;
    e.preventDefault();
    zoom(e.deltaY>0?1.15:.87,canvasPoint(svg,e.clientX,e.clientY));
  },{passive:false});
  canvas.addEventListener('pointerdown',e=>{
    const svg=$('diagram');
    if (!svg || e.button!==0) return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
    suppressClick=false;
  });
  canvas.addEventListener('pointermove',e=>{
    const svg=$('diagram');
    if (!drag || !svg || e.pointerId!==drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5) return;
    if (!drag.moved) svg.setPointerCapture(e.pointerId);
    drag.moved=true;
    const c=getCamera(), a=canvasPoint(svg,drag.x,drag.y), b=canvasPoint(svg,e.clientX,e.clientY);
    camera={...c,x:c.x+a.x-b.x,y:c.y+a.y-b.y};
    setCamera();
    drag.x=e.clientX;
    drag.y=e.clientY;
  });
  const release=e=>{
    if (drag?.id!==e.pointerId) return;
    suppressClick=drag.moved;
    drag=null;
    setTimeout(()=>suppressClick=false,0);
  };
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
}

try {
  buildRegistry();
  if (list('Zone').length!==4 || list('Line').length!==7 || list('Equipment').length!==33 || list('Process').length!==26 || specModels.size!==16 || eqSpecs.size!==33) throw new Error('Thiếu dữ liệu trong registry kỹ thuật');
  $('libraries').innerHTML=['models','faults','controls','reference'].map(id=>link(id,title(id),'nav-item')).join('');
  setupEvents();
  if (render(factory)) {
    $('app').hidden=false;
    $('startup').hidden=true;
    if (location.protocol!=='file:') {
      loadOperation();
      setInterval(()=>{
        if (!simulation.session || simulation.asset || /^Z0[1-4]-L0[12]/.test(selected)) loadOperation();
      },1000);
    }
  }
} catch (error) {
  console.error(error);
  $('startup').insertAdjacentHTML('afterbegin',note('Không thể khởi tạo sơ đồ tương tác. Có thể mở đặc tả kỹ thuật bên dưới.'));
}


</script>
